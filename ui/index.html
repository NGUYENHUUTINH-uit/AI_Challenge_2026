<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Utis - Vision AI</title>
    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base Dark Space Theme */
        body { 
            background-color: #020617; /* Tailwind slate-950 */
            color: #f8fafc; 
        }
        
        /* Custom Scrollbar for Right Area */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        /* Futuristic Hover Glow Animation */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); border-color: rgba(168, 85, 247, 0.4); }
            50% { box-shadow: 0 0 35px rgba(168, 85, 247, 0.7); border-color: rgba(168, 85, 247, 0.9); }
        }
        .hover-pulse-glow:hover {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .drag-active {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            background-color: rgba(168, 85, 247, 0.1) !important;
        }

        /* Neon Text Glows */
        .text-glow-green {
            text-shadow: 0 0 12px rgba(74, 222, 128, 0.9);
        }
        
        /* Masonry Item Helper */
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased overflow-hidden flex relative">
    
    <!-- Fixed Background Ambient Orbs (Deep Purple & Cyan) -->
    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-purple-900/30 blur-[150px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] right-[10%] w-[40vw] h-[40vw] rounded-full bg-cyan-900/10 blur-[120px] pointer-events-none z-0"></div>

    <!-- Asymmetric Layout: Left Sidebar (Input Panel) -->
    <aside class="w-full max-w-[360px] h-screen fixed left-0 top-0 border-r border-white/5 bg-slate-900/30 backdrop-blur-2xl z-20 flex flex-col p-8 shadow-[15px_0_30px_rgba(0,0,0,0.5)]">
        
        <!-- Sidebar Top: Title -->
        <div class="flex items-center gap-4 mb-12">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-cyan-500 flex items-center justify-center shadow-[0_0_20px_rgba(168,85,247,0.4)]">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-cyan-300 uppercase">Vision AI</h1>
                <p class="text-[10px] text-slate-400 font-mono tracking-[0.2em] uppercase mt-0.5">Team Utis Core</p>
            </div>
        </div>

        <!-- Sidebar Middle: Drag and Drop -->
        <div class="flex-1 flex flex-col gap-8 justify-center">
            <div id="dropzone" class="border-2 border-dashed border-slate-700/80 rounded-[2rem] p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 cursor-pointer group bg-slate-950/40 hover-pulse-glow shadow-[inset_0_0_20px_rgba(0,0,0,0.5)]">
                <div class="w-16 h-16 rounded-full bg-slate-900 border border-white/5 flex items-center justify-center group-hover:bg-purple-900/30 transition-all duration-300 shadow-xl group-hover:scale-110">
                    <svg class="w-8 h-8 text-slate-500 group-hover:text-purple-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </div>
                <div class="text-center">
                    <p class="text-slate-300 font-bold tracking-widest text-[11px] uppercase mb-1.5 group-hover:text-white transition-colors">Target Image File</p>
                    <p class="text-slate-600 text-[10px] uppercase font-mono">Drop file or click to browse</p>
                </div>
                <input type="file" id="fileInput" class="hidden" accept="image/*">
            </div>

            <!-- Sidebar Bottom: Search & Suggestions -->
            <div class="flex flex-col gap-6">
                <!-- Text Area -->
                <div class="relative group">
                    <div class="absolute top-4 left-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-600 group-focus-within:text-purple-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <textarea id="searchInput" rows="3" placeholder="Define semantic parameters..." 
                        class="block w-full pl-12 pr-4 py-4 bg-slate-950/70 border border-slate-700/60 rounded-2xl text-slate-200 placeholder-slate-700 focus:outline-none focus:ring-1 focus:ring-purple-500/50 focus:border-purple-500/50 text-sm transition-all shadow-[inset_0_2px_10px_rgba(0,0,0,0.8)] resize-none"></textarea>
                </div>
                
                <!-- Suggestions -->
                <div class="flex flex-wrap gap-2">
                    <button class="text-[9px] font-bold px-3 py-1.5 rounded-full border border-slate-800 bg-slate-900/80 text-slate-500 hover:text-cyan-300 hover:border-cyan-500/80 hover:shadow-[0_0_12px_rgba(6,182,212,0.4)] transition-all uppercase tracking-widest">Neon City</button>
                    <button class="text-[9px] font-bold px-3 py-1.5 rounded-full border border-slate-800 bg-slate-900/80 text-slate-500 hover:text-purple-300 hover:border-purple-500/80 hover:shadow-[0_0_12px_rgba(168,85,247,0.4)] transition-all uppercase tracking-widest">Fast Pursuit</button>
                    <button class="text-[9px] font-bold px-3 py-1.5 rounded-full border border-slate-800 bg-slate-900/80 text-slate-500 hover:text-pink-300 hover:border-pink-500/80 hover:shadow-[0_0_12px_rgba(236,72,153,0.4)] transition-all uppercase tracking-widest">Crowded Plaza</button>
                </div>

                <!-- Search Action -->
                <button id="searchBtn" class="mt-2 w-full bg-gradient-to-r from-purple-600 via-fuchsia-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-4 rounded-2xl shadow-[0_0_20px_rgba(192,38,211,0.2)] hover:shadow-[0_0_30px_rgba(192,38,211,0.5)] transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-3">
                    <span class="tracking-widest text-xs uppercase">Search Images</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- Right Main Area (Scrollable Image Results) -->
    <!-- ml-[360px] to offset the fixed sidebar -->
    <main class="ml-[360px] flex-1 h-screen overflow-y-auto relative z-10 px-8 py-10">
        
        <div class="flex items-end justify-between mb-8 sticky top-0 bg-slate-950/80 backdrop-blur-md py-4 rounded-xl px-4 z-30 border border-white/5 shadow-2xl">
            <div>
                <h2 class="text-xl font-bold text-slate-100 flex items-center gap-3 tracking-widest uppercase">
                    Retrieved Frames
                </h2>
                <p class="text-[10px] text-slate-500 mt-1 font-mono uppercase tracking-wider">Similarity threshold > 75%</p>
            </div>
            <div class="text-[10px] font-bold tracking-widest text-slate-400 flex items-center gap-2 bg-slate-900/60 px-4 py-2 rounded-lg border border-slate-800">
                <span class="w-2 h-2 rounded-full bg-purple-500 animate-pulse shadow-[0_0_8px_rgba(168,85,247,1)]"></span>
                <span id="resultCount" class="text-purple-300">12</span> MATCHES
            </div>
        </div>
        
        <!-- Masonry-style Grid -->
        <div id="resultsGrid" class="columns-1 sm:columns-2 lg:columns-3 xl:columns-4 gap-4 space-y-4 pb-20">
            <!-- JS Inject -->
        </div>

    </main>

    <script>
        // --- Drag and Drop Logic ---
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const searchInput = document.getElementById('searchInput');

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-active'); });
        dropzone.addEventListener('dragleave', (e) => { e.preventDefault(); dropzone.classList.remove('drag-active'); });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-active');
            if (e.dataTransfer.files.length) {
                const file = e.dataTransfer.files[0];
                dropzone.querySelector('p.font-bold').textContent = file.name;
                dropzone.querySelector('p.font-mono').textContent = (file.size / (1024*1024)).toFixed(2) + " MB";
                dropzone.style.borderColor = "rgba(168, 85, 247, 1)";
            }
        });

        // Concept Chips
        document.querySelectorAll('aside .flex-wrap > button').forEach(btn => {
            btn.addEventListener('click', () => {
                searchInput.value = btn.textContent;
                searchInput.focus();
            });
        });

        // --- Data & Masonry Rendering ---
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // Dummy data with varied aspect ratios for masonry effect
        const dummyData = [
            { id: 'IMG_A01', time: 135, score: 98, objects: ['person', 'night'], height: 'h-64', img: 'https://picsum.photos/seed/a1/400/500' },
            { id: 'IMG_B02', time: 250, score: 95, objects: ['car', 'street'], height: 'h-48', img: 'https://picsum.photos/seed/b2/400/300' },
            { id: 'IMG_C03', time: 420, score: 92, objects: ['neon', 'rain'], height: 'h-72', img: 'https://picsum.photos/seed/c3/400/600' },
            { id: 'IMG_D04', time: 15, score: 89, objects: ['crowd', 'city'], height: 'h-56', img: 'https://picsum.photos/seed/d4/400/400' },
            { id: 'IMG_E05', time: 3600, score: 85, objects: ['building', 'sky'], height: 'h-64', img: 'https://picsum.photos/seed/e5/400/500' },
            { id: 'IMG_F06', time: 1840, score: 82, objects: ['dog', 'park'], height: 'h-40', img: 'https://picsum.photos/seed/f6/400/250' },
            { id: 'IMG_G07', time: 940, score: 79, objects: ['mountain', 'road'], height: 'h-80', img: 'https://picsum.photos/seed/g7/400/700' },
            { id: 'IMG_H08', time: 215, score: 75, objects: ['ocean', 'boat'], height: 'h-56', img: 'https://picsum.photos/seed/h8/400/450' },
            { id: 'IMG_I09', time: 110, score: 91, objects: ['abstract', 'art'], height: 'h-72', img: 'https://picsum.photos/seed/i9/400/600' },
            { id: 'IMG_J10', time: 330, score: 88, objects: ['food', 'table'], height: 'h-48', img: 'https://picsum.photos/seed/j10/400/300' },
        ];

        function renderResults() {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';
            
            document.getElementById('resultCount').textContent = dummyData.length;

            dummyData.forEach(item => {
                const card = document.createElement('div');
                // Masonry item setup + smooth hover
                card.className = `masonry-item relative w-full ${item.height} bg-slate-900 rounded-2xl overflow-hidden group cursor-crosshair shadow-lg transition-transform duration-500 ease-out hover:scale-[1.03] hover:z-10`;
                
                let scoreClass = 'text-green-400 text-glow-green';
                if(item.score < 85) scoreClass = 'text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.8)]';
                if(item.score < 75) scoreClass = 'text-orange-400 drop-shadow-[0_0_8px_rgba(251,146,60,0.8)]';

                card.innerHTML = `
                    <!-- Background Image -->
                    <img src="${item.img}" alt="Thumb" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-all duration-700 ease-out group-hover:scale-110">
                    
                    <!-- Top Gradient Shadow (Always visible for ID) -->
                    <div class="absolute top-0 left-0 w-full h-1/3 bg-gradient-to-b from-black/80 to-transparent p-4">
                        <div class="text-[10px] font-bold text-slate-300 tracking-widest font-mono drop-shadow-md opacity-50 group-hover:opacity-100 transition-opacity">${item.id}</div>
                    </div>
                    
                    <!-- Bottom Sliding Metadata Overlay -->
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/95 via-slate-950/50 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300 ease-out flex flex-col justify-end p-5 translate-y-6 group-hover:translate-y-0">
                        
                        <div class="flex justify-between items-end mb-3">
                            <!-- Timestamp -->
                            <div class="text-xs font-mono font-bold text-slate-200 tracking-widest border border-white/20 bg-black/50 backdrop-blur-md px-2 py-1 rounded">
                                ${formatTime(item.time)}
                            </div>
                            
                            <!-- Glowing Similarity Score -->
                            <div class="font-extrabold text-lg ${scoreClass} font-mono tracking-tight">
                                ${item.score}% <span class="text-[10px] uppercase text-slate-400 tracking-widest block text-right mt-[-4px] shadow-none">Match</span>
                            </div>
                        </div>
                        
                        <!-- Tiny Elegant Concept Tags -->
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            ${item.objects.map(obj => `
                                <span class="bg-white/10 border border-white/10 text-slate-200 text-[9px] uppercase font-bold tracking-widest px-2.5 py-1 rounded-sm shadow-sm backdrop-blur-sm">
                                    ${obj}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Action
        document.getElementById('searchBtn').addEventListener('click', () => {
            const btn = document.getElementById('searchBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 
                             <span class="text-xs tracking-widest uppercase">Analyzing...</span>`;
            setTimeout(() => {
                dummyData.sort(() => Math.random() - 0.5);
                renderResults();
                btn.innerHTML = originalContent;
            }, 1200);
        });

        renderResults();
    </script>
</body>
</html>
