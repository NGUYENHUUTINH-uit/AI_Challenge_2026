<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Utis - Vision AI</title>
    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px) scale(0.95)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Base styles cho Light / Dark mode hài hòa */
        body { 
            @apply bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-500 ease-in-out;
            background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.05), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(14, 165, 233, 0.05), transparent 40%);
        }
        
        .dark body {
            background-image: radial-gradient(circle at top right, rgba(168, 85, 247, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.1), transparent 40%);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-300 dark:bg-slate-700 rounded-full; }
        ::-webkit-scrollbar-thumb:hover { @apply bg-slate-400 dark:bg-slate-600; }

        /* Animations Glowing */
        @keyframes pulse-glow-dark {
            0%, 100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); border-color: rgba(168, 85, 247, 0.4); }
            50% { box-shadow: 0 0 35px rgba(168, 85, 247, 0.7); border-color: rgba(168, 85, 247, 0.9); }
        }
        @keyframes pulse-glow-light {
            0%, 100% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5); border-color: rgba(139, 92, 246, 0.7); }
        }
        
        .dark .hover-pulse-glow:hover, .dark .drag-active { animation: pulse-glow-dark 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .hover-pulse-glow:hover, .drag-active { animation: pulse-glow-light 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        .dark .drag-active { background-color: rgba(168, 85, 247, 0.1) !important; }
        .drag-active { background-color: rgba(139, 92, 246, 0.05) !important; }

        /* Card Hover 3D Effect */
        .card-3d-hover {
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card-3d-hover:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1), 0 0 20px rgba(139, 92, 246, 0.15);
        }
        .dark .card-3d-hover:hover {
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5), 0 0 25px rgba(168, 85, 247, 0.25);
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased overflow-hidden flex relative">
    
    <!-- Theme Toggle (Góc trên cùng bên phải) -->
    <div class="fixed top-4 right-8 z-50">
        <button id="themeToggle" class="p-3 rounded-full bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:scale-110 hover:shadow-[0_0_15px_rgba(139,92,246,0.3)] transition-all shadow-lg">
            <!-- Sun Icon for Light Mode -->
            <svg class="w-5 h-5 hidden dark:block text-amber-400 drop-shadow-[0_0_5px_rgba(251,191,36,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <!-- Moon Icon for Dark Mode -->
            <svg class="w-5 h-5 block dark:hidden text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
    </div>

    <!-- Left Sidebar (Input Panel - Đã chuyển sang bên trái) -->
    <aside id="leftPanel" class="fixed left-0 top-0 h-screen border-r border-slate-200/60 dark:border-white/5 bg-white/70 dark:bg-slate-900/50 backdrop-blur-3xl z-20 flex flex-col p-8 shadow-[10px_0_40px_rgba(0,0,0,0.03)] dark:shadow-[15px_0_40px_rgba(0,0,0,0.4)] transition-colors duration-500" style="width: 420px;">
        
        <!-- Sidebar Top: Title -->
        <div class="flex items-center gap-4 mb-12 animate-fade-in-up" style="animation-delay: 0ms;">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-500 dark:from-purple-600 dark:to-cyan-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 dark:shadow-[0_0_20px_rgba(168,85,247,0.4)] relative overflow-hidden group">
                <div class="absolute inset-0 bg-white/20 group-hover:translate-x-full transition-transform duration-700 skew-x-12 -translate-x-full"></div>
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-purple-600 dark:from-purple-400 dark:to-cyan-300 uppercase">Vision AI</h1>
                <p class="text-[10px] text-slate-500 dark:text-slate-400 font-mono tracking-[0.2em] uppercase mt-0.5">Team Utis Core</p>
            </div>
        </div>

        <!-- Sidebar Middle: Drag and Drop -->
        <div class="flex-1 flex flex-col gap-8 justify-center">
            <div id="dropzone" class="animate-fade-in-up border-2 border-dashed border-slate-300 dark:border-slate-700/80 rounded-[2rem] p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 cursor-pointer group bg-slate-100/50 dark:bg-slate-950/40 hover-pulse-glow shadow-inner" style="animation-delay: 100ms;">
                <div class="w-16 h-16 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-white/5 flex items-center justify-center group-hover:bg-indigo-50 dark:group-hover:bg-purple-900/30 transition-all duration-300 shadow-sm dark:shadow-lg group-hover:scale-110">
                    <svg class="w-8 h-8 text-slate-400 group-hover:text-indigo-500 dark:group-hover:text-purple-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </div>
                <div class="text-center">
                    <p class="text-slate-700 dark:text-slate-300 font-bold tracking-widest text-[11px] uppercase mb-1.5 group-hover:text-indigo-600 dark:group-hover:text-white transition-colors">Tải Ảnh / Video Gốc</p>
                    <p class="text-slate-500 text-[10px] uppercase font-mono">Kéo thả hoặc click để duyệt</p>
                </div>
                <input type="file" id="fileInput" class="hidden" accept="image/*,video/*">
            </div>

            <!-- Sidebar Bottom: Search & Suggestions -->
            <div class="flex flex-col gap-6 animate-fade-in-up" style="animation-delay: 200ms;">
                <div class="relative group">
                    <div class="absolute top-4 left-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400 dark:text-slate-500 group-focus-within:text-indigo-500 dark:group-focus-within:text-purple-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <textarea id="searchInput" rows="4" placeholder="Mô tả ngữ nghĩa phân cảnh..." 
                        class="block w-full pl-12 pr-4 py-4 bg-white/80 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-700/60 rounded-2xl text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 dark:focus:ring-purple-500/50 text-sm transition-all shadow-inner resize-none"></textarea>
                </div>
                
                <div class="flex flex-wrap gap-2">
                    <button class="text-[10px] font-bold px-4 py-1.5 rounded-full border border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/80 text-slate-500 hover:text-indigo-600 dark:hover:text-cyan-300 hover:border-indigo-300 dark:hover:border-cyan-500/80 hover:shadow-md dark:hover:shadow-[0_0_12px_rgba(6,182,212,0.5)] transition-all uppercase tracking-wider backdrop-blur-sm">Đường phố đêm</button>
                    <button class="text-[10px] font-bold px-4 py-1.5 rounded-full border border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/80 text-slate-500 hover:text-purple-600 dark:hover:text-purple-300 hover:border-purple-300 dark:hover:border-purple-500/80 hover:shadow-md dark:hover:shadow-[0_0_12px_rgba(168,85,247,0.5)] transition-all uppercase tracking-wider backdrop-blur-sm">Hành động nhanh</button>
                </div>

                <button id="searchBtn" class="mt-2 w-full bg-gradient-to-r from-indigo-500 to-purple-600 dark:from-purple-600 dark:via-fuchsia-600 dark:to-pink-600 hover:from-indigo-600 hover:to-purple-700 dark:hover:from-purple-500 dark:hover:to-pink-500 text-white font-bold py-4 rounded-2xl shadow-[0_8px_20px_rgba(99,102,241,0.3)] dark:shadow-[0_0_20px_rgba(192,38,211,0.3)] hover:shadow-[0_12px_25px_rgba(99,102,241,0.5)] dark:hover:shadow-[0_0_30px_rgba(192,38,211,0.6)] transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-3">
                    <span class="tracking-widest uppercase text-sm">Truy Xuất Dữ Liệu</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- Resizer Handle -->
    <div id="resizer" class="fixed top-0 bottom-0 w-2 bg-transparent hover:bg-indigo-500/20 dark:hover:bg-purple-500/30 cursor-col-resize z-40 transition-colors" style="left: 420px;"></div>

    <!-- Right Main Area (Image Results - Đã chuyển sang bên phải) -->
    <main id="rightPanel" class="flex-1 h-screen overflow-y-auto relative z-10 px-10 py-12" style="margin-left: 420px;">
        
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-10 sticky top-0 bg-slate-50/90 dark:bg-slate-900/80 backdrop-blur-xl py-5 rounded-2xl px-6 z-30 border border-slate-200/50 dark:border-white/5 shadow-sm dark:shadow-xl transition-colors duration-500">
            <div>
                <h2 class="text-2xl font-extrabold text-slate-800 dark:text-slate-100 flex items-center gap-3 tracking-widest uppercase">
                    <svg class="w-7 h-7 text-indigo-500 dark:text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Kết Quả Trích Xuất
                </h2>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-2 font-medium tracking-wider flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>
                    Sắp xếp: Độ tương đồng % giảm dần. Nếu bằng nhau xếp theo thời gian tăng dần.
                </p>
            </div>
            <div class="text-[11px] font-bold tracking-widest text-slate-600 dark:text-slate-300 flex items-center gap-2 bg-white dark:bg-slate-950/60 px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 dark:bg-cyan-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.6)] dark:shadow-[0_0_10px_rgba(6,182,212,1)]"></span>
                <span id="resultCount" class="text-indigo-600 dark:text-cyan-300 font-black text-sm">12</span> KẾT QUẢ TÌM THẤY
            </div>
        </div>
        
        <!-- Grid 3 cột cố định -->
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-20">
            <!-- JavaScript Inject -->
        </div>

    </main>

    <script>
        // --- Theme Toggle Logic ---
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        
        // Kiểm tra theme đã lưu
        if (localStorage.theme === 'light') {
            html.classList.remove('dark');
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

        // --- Resizer Logic ---
        const resizer = document.getElementById('resizer');
        const leftPanel = document.getElementById('leftPanel');
        const rightPanel = document.getElementById('rightPanel');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none'; 
        });

        window.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            let newWidth = e.clientX;
            // Giới hạn độ rộng min max cho Sidebar bên trái
            if (newWidth < 320) newWidth = 320;
            if (newWidth > 600) newWidth = 600;
            
            leftPanel.style.width = newWidth + 'px';
            resizer.style.left = newWidth + 'px';
            rightPanel.style.marginLeft = newWidth + 'px';
        });

        window.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                document.body.style.userSelect = 'auto';
            }
        });

        // --- Drag and Drop Logic ---
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const searchInput = document.getElementById('searchInput');

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-active'); });
        dropzone.addEventListener('dragleave', (e) => { e.preventDefault(); dropzone.classList.remove('drag-active'); });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-active');
            if (e.dataTransfer.files.length) {
                const file = e.dataTransfer.files[0];
                dropzone.querySelector('p.font-bold').textContent = file.name;
                dropzone.querySelector('p.font-mono').textContent = (file.size / (1024*1024)).toFixed(2) + " MB";
                dropzone.style.borderColor = html.classList.contains('dark') ? "rgba(168, 85, 247, 1)" : "rgba(99, 102, 241, 1)";
            }
        });

        // Concept Chips
        document.querySelectorAll('aside .flex-wrap > button').forEach(btn => {
            btn.addEventListener('click', () => {
                searchInput.value = btn.textContent;
                searchInput.focus();
            });
        });

        // --- Data & Custom Sorting ---
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        let dummyData = [
            { id: 'IMG_A01', time: 135, score: 98, objects: ['person', 'night'], img: 'https://picsum.photos/seed/1/600/450' },
            { id: 'IMG_B02', time: 250, score: 95, objects: ['car', 'street'], img: 'https://picsum.photos/seed/2/600/450' },
            { id: 'IMG_C03', time: 420, score: 92, objects: ['neon', 'rain'], img: 'https://picsum.photos/seed/3/600/450' },
            { id: 'IMG_D04', time: 15,  score: 89, objects: ['crowd', 'city'], img: 'https://picsum.photos/seed/4/600/450' },
            { id: 'IMG_E05', time: 3600,score: 85, objects: ['building', 'sky'], img: 'https://picsum.photos/seed/5/600/450' },
            { id: 'IMG_F06', time: 1840,score: 82, objects: ['dog', 'park'], img: 'https://picsum.photos/seed/6/600/450' },
            { id: 'IMG_G07', time: 940, score: 79, objects: ['mountain', 'road'], img: 'https://picsum.photos/seed/7/600/450' },
            { id: 'IMG_H08', time: 215, score: 75, objects: ['ocean', 'boat'], img: 'https://picsum.photos/seed/8/600/450' },
            { id: 'IMG_I09', time: 110, score: 91, objects: ['abstract', 'art'], img: 'https://picsum.photos/seed/9/600/450' },
            { id: 'IMG_J10', time: 330, score: 88, objects: ['food', 'table'], img: 'https://picsum.photos/seed/10/600/450' },
            { id: 'IMG_K11', time: 5,   score: 96, objects: ['bike', 'man'], img: 'https://picsum.photos/seed/11/600/450' },
            { id: 'IMG_L12', time: 800, score: 72, objects: ['cat', 'window'], img: 'https://picsum.photos/seed/12/600/450' }
        ];

        // Sắp xếp: Ưu tiên Độ tương đồng (Score) giảm dần.
        // Nếu Score bằng nhau, xếp theo Thời gian (Time) tăng dần.
        function customSort(data) {
            return [...data].sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return a.time - b.time;
            });
        }

        function renderResults(data) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';
            
            const processedData = customSort(data);
            document.getElementById('resultCount').textContent = processedData.length;

            processedData.forEach((item, index) => {
                const wrapper = document.createElement('div');
                
                // Hiệu ứng Fade In Up đan xen với delay (sinh động hơn)
                const animationDelay = (index % 3) * 100 + Math.floor(index / 3) * 150;
                // Hiệu ứng lơ lửng (float) với delay ngẫu nhiên để các thẻ không cùng nhịp
                const floatDelay = (index % 3) * 0.5 + Math.random();
                
                wrapper.className = `animate-fade-in-up`;
                wrapper.style.animationDelay = `${animationDelay}ms`;

                let scoreClass = 'text-emerald-600 dark:text-cyan-400 drop-shadow-[0_0_5px_rgba(16,185,129,0.3)] dark:drop-shadow-[0_0_8px_rgba(6,182,212,0.8)]';
                if(item.score < 85) scoreClass = 'text-amber-500 dark:text-amber-400 drop-shadow-[0_0_5px_rgba(245,158,11,0.3)] dark:drop-shadow-[0_0_8px_rgba(251,191,36,0.8)]';
                if(item.score < 75) scoreClass = 'text-rose-500 dark:text-rose-400 drop-shadow-[0_0_5px_rgba(244,63,94,0.3)] dark:drop-shadow-[0_0_8px_rgba(251,113,133,0.8)]';

                wrapper.innerHTML = `
                    <div class="animate-float card-3d-hover relative w-full aspect-[4/3] bg-white dark:bg-slate-900 rounded-3xl overflow-hidden group cursor-crosshair border border-slate-200 dark:border-slate-800" style="animation-delay: ${floatDelay}s;">
                        <img src="${item.img}" alt="Thumb" class="w-full h-full object-cover opacity-90 dark:opacity-80 group-hover:opacity-100 transition-transform duration-700 ease-out group-hover:scale-[1.08]">
                    
                    <div class="absolute top-0 left-0 w-full h-1/3 bg-gradient-to-b from-slate-900/40 dark:from-black/80 to-transparent p-4">
                        <div class="text-[11px] font-bold text-white tracking-widest font-mono drop-shadow-md opacity-80 group-hover:opacity-100 transition-opacity bg-black/20 dark:bg-transparent w-max px-2 py-1 rounded">${item.id}</div>
                    </div>
                    
                    <!-- Metadata Overlay (Mượt mà trượt lên) -->
                    <div class="absolute inset-0 bg-gradient-to-t from-white/95 via-white/80 dark:from-slate-950/95 dark:via-slate-950/70 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-400 ease-out flex flex-col justify-end p-5 translate-y-8 group-hover:translate-y-0">
                        
                        <div class="flex justify-between items-end mb-3">
                            <div class="text-xs font-mono font-bold text-slate-800 dark:text-white tracking-widest border border-slate-300 dark:border-white/20 bg-white/50 dark:bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-lg shadow-sm">
                                ${formatTime(item.time)}
                            </div>
                            
                            <div class="font-black text-xl ${scoreClass} font-mono tracking-tighter">
                                ${item.score}% <span class="text-[9px] uppercase text-slate-500 dark:text-slate-400 tracking-widest block text-right mt-[-2px] drop-shadow-none">Match</span>
                            </div>
                        </div>
                        
                        <div class="flex flex-wrap gap-2 mt-2">
                            ${item.objects.map(obj => `
                                <span class="bg-indigo-50 dark:bg-white/10 border border-indigo-100 dark:border-white/10 text-indigo-600 dark:text-slate-200 text-[10px] uppercase font-bold tracking-widest px-3 py-1.5 rounded-md shadow-sm backdrop-blur-md transition-colors hover:bg-indigo-100 dark:hover:bg-white/20">
                                    ${obj}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                    </div>
                `;
                grid.appendChild(wrapper);
            });
        }

        // --- Demo Search Action ---
        document.getElementById('searchBtn').addEventListener('click', () => {
            const btn = document.getElementById('searchBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 
                             <span class="text-sm tracking-widest uppercase">Đang phân tích...</span>`;
            
            // Xóa lưới hiện tại để trigger lại animation
            document.getElementById('resultsGrid').innerHTML = '';

            setTimeout(() => {
                let newData = dummyData.map(item => ({
                    ...item,
                    score: Math.floor(Math.random() * (99 - 60 + 1)) + 60,
                    time: Math.floor(Math.random() * 5000)
                }));
                renderResults(newData);
                btn.innerHTML = originalContent;
            }, 800);
        });

        // Initialize
        renderResults(dummyData);
    </script>
</body>
</html>
